<!doctype html><html lang="en"><meta charset="utf-8"><title>STEVE explicit project lock fixture</title>
<style>body{margin:0;background:#111820;color:#eaf0f5;font:14px system-ui}header{padding:16px}button,input{padding:8px;margin:4px}#viewport{height:70vh;position:relative;background:#233b42;margin:0 20px;border:1px solid #52626a;border-radius:12px}#context{padding:20px}#log{white-space:pre-wrap;max-width:55%;padding:20px}</style>
<header><strong>STEVE project lock · synthetic bridge only</strong><p>No real bridge, project writes, or model prompts. Use viewport controls to confirm/cancel a synthetic lock.</p>
<button id="view-a">View Mount v1 #844cc9ab</button><button id="view-b">View SteveTest #88b644e1</button>
<button id="send">Test send guard</button><button id="busy">Toggle fake busy</button><button id="external">Other browser changes lock</button>
<input id="draft" value="Keep this draft in its project" aria-label="Draft"></header>
<main id="viewport"><div id="context"></div><pre id="log"></pre></main>
<script type="module">
import { mountSteveActivity } from './steve-activity-ui.js?v=20261008-project-lock-p1';
import { SteveProjectBinding, bindingError } from './steve-project-binding.js?v=20261008-project-lock-p1';
import { SteveDesignChat } from './steve-design-chat.js?v=20261008-project-lock-p1';
const owner={userId:'fixture-alice',projectId:'844cc9ab'}, projects=[{id:'844cc9ab',name:'Mount v1'},{id:'88b644e1',name:'SteveTest'}];
const bindingState=new SteveProjectBinding(), calls=[], opened=[], values=new Map();
let binding={renderUserId:owner.userId,renderProjectId:owner.projectId,revision:'fixture-1'}, busy=false, sequence=1, submissions=0;
const chat=new SteveDesignChat({storage:{get length(){return values.size},key:i=>[...values.keys()][i],getItem:k=>values.get(k),setItem:(k,v)=>values.set(k,v),removeItem:k=>values.delete(k)}});
const connector={status:{busy:false},project:async packet=>{
 calls.push({...packet});connector.status.busy=busy;
 if(packet.action==='bind'){
  if(busy)throw bindingError('project_busy');
  if(packet.expectedRevision!==(binding?.revision??null))throw bindingError('project_binding_changed');
  binding={renderUserId:packet.renderUserId,renderProjectId:packet.renderProjectId,revision:'fixture-'+(++sequence)};
 }
 return {version:1,binding};
}};
function render(){document.querySelector('#context').textContent='Viewing '+projects.find(p=>p.id===owner.projectId).name+' #'+owner.projectId;
 document.querySelector('#log').textContent=JSON.stringify({binding,busy,bindWrites:calls.filter(c=>c.action==='bind'),submissions,historyRows:values.size},null,2);}
function view(id){owner.projectId=id;window.dispatchEvent(new Event('render3d:project-changed'));render();}
const ui=mountSteveActivity({host:document.querySelector('#viewport'),getOwner:()=>owner,getProjects:()=>projects,
 projectLabel:id=>projects.find(p=>p.id===id)?.name||id,bindingState,projectConnector:connector,
 read:async()=>({version:1,binding,epoch:binding?.revision||'unbound',cursor:sequence,reset:true,
 requests:binding?[{requestId:'fixture-request',renderUserId:binding.renderUserId,renderProjectId:binding.renderProjectId,
 phase:busy?'running':'completed',messages:[{id:'reply',role:'assistant',text:'Synthetic history'}]}]:[]}),
 ingest:()=>render(),onAvailability:()=>{},openProject:async(id,isCurrent)=>{if(isCurrent()){opened.push(id);view(id);}}});
bindingState.subscribe(render);
document.querySelector('#view-a').onclick=()=>view('844cc9ab');
document.querySelector('#view-b').onclick=()=>view('88b644e1');
document.querySelector('#send').onclick=async()=>{
 try{await chat.submit({prepareSubmission:async target=>{await bindingState.refresh(connector);return bindingState.assertOwner(target)},
 submitCurrent:async()=>{submissions++;return {accepted:true}},connector:{watch:async()=>{}}},
 {owner,prompt:document.querySelector('#draft').value,requestId:crypto.randomUUID()});}
 catch(error){document.querySelector('#context').textContent=error.message;}
 render();
};
document.querySelector('#busy').onclick=async()=>{busy=!busy;connector.status.busy=busy;await ui.activity.tick();render();};
document.querySelector('#external').onclick=async()=>{binding={...binding,renderProjectId:binding.renderProjectId==='844cc9ab'?'88b644e1':'844cc9ab',revision:'fixture-'+(++sequence)};await ui.activity.tick();render();};
window.fixture={ui,owner,opened,calls,bindingState,view,get binding(){return binding},get submissions(){return submissions}};
render();
</script></html>
